name: Unit Test Log Box

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/log_box/**'
    branches:
      - 'master'
  pull_request:
    paths:
      - 'packages/log_box/**'
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      total_coverage: ${{ steps.coverage_extraction.outputs.total_coverage }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: master

      - name: "Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: "Install Packages"
        working-directory: ./packages/log_box
        run: flutter pub get

      - name: 'Run Test'
        working-directory: ./packages/log_box
        run: flutter test --coverage

      - id: coverage_extraction
        name: "Extract Coverage Percentage"
        working-directory: ./packages/log_box
        run: |
          # Install lcov to use the lcov --summary command
          sudo apt-get update
          sudo apt-get install -y lcov

          # Extract the percentage
          # We use lcov summary and awk to isolate the 'lines' percentage
          TOTAL_COVERAGE=$(lcov --summary coverage/lcov.info | grep lines | cut -d ' ' -f 4 | cut -d '%' -f 1)

          # Set the output for this step
          echo "total_coverage=$TOTAL_COVERAGE" >> $GITHUB_OUTPUT

          # Post to the Step Summary so it's visible in the GitHub UI
          echo "### 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "* **Package:** log_box" >> $GITHUB_STEP_SUMMARY
          echo "* **Line Coverage:** ${TOTAL_COVERAGE}%" >> $GITHUB_STEP_SUMMARY

  unit_test:
    runs-on: ubuntu-latest
    outputs:
      total_coverage: ${{ steps.coverage_extraction.outputs.total_coverage }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: "Install Packages"
        working-directory: ./packages/log_box
        run: flutter pub get

      - name: 'Run Test'
        working-directory: ./packages/log_box
        run: flutter test --coverage

      - id: coverage_extraction
        name: "Extract Coverage Percentage"
        working-directory: ./packages/log_box
        run: |
          # Install lcov to use the lcov --summary command
          sudo apt-get update
          sudo apt-get install -y lcov
          
          # Extract the percentage
          # We use lcov summary and awk to isolate the 'lines' percentage
          TOTAL_COVERAGE=$(lcov --summary coverage/lcov.info | grep lines | cut -d ' ' -f 4 | cut -d '%' -f 1)
          
          # Set the output for this step
          echo "total_coverage=$TOTAL_COVERAGE" >> $GITHUB_OUTPUT

          # Post to the Step Summary so it's visible in the GitHub UI
          echo "### 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "* **Package:** log_box" >> $GITHUB_STEP_SUMMARY
          echo "* **Line Coverage:** ${TOTAL_COVERAGE}%" >> $GITHUB_STEP_SUMMARY

  compare_coverage:
    runs-on: ubuntu-latest
    needs: [baseline, unit_test]
    if: always() && github.event_name == 'pull_request'
    steps:

      - name: 'Compare Results'
        id: compare
        run: |
          # Fallback to 0.00 if outputs are missing or null
          BASE=${{ needs.baseline.outputs.total_coverage || '0.00' }}
          PR=${{ needs.unit_test.outputs.total_coverage || '0.00' }}

          # Floating point math via awk
          DIFF=$(awk "BEGIN {print $PR - $BASE}")

          if (( $(echo "$DIFF < 0" | bc -l) )); then
            ICON="📉"
          elif (( $(echo "$DIFF > 0" | bc -l) )); then
            ICON="📈"
            DIFF="+$DIFF"
          else
            ICON="➖"
          fi

          echo "base_val=$BASE" >> $GITHUB_OUTPUT
          echo "pr_val=$PR" >> $GITHUB_OUTPUT
          echo "diff=$DIFF" >> $GITHUB_OUTPUT
          echo "icon=$ICON" >> $GITHUB_OUTPUT

      - name: 'Find Previous Results'
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'CI/CD Pipeline Results'

      - name: 'Create or Update Comment'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            # CI/CD Pipeline Results (log_box)

            | Metric | Main (Base) | PR (Current) | Diff |
            |:---:|:---:|:---:|:---|
            | **Total Coverage** | ${{ steps.compare.outputs.base_val }}% | ${{ steps.compare.outputs.pr_val }}% | ${{ steps.compare.outputs.icon }} **${{ steps.compare.outputs.diff }}%** |

            ### Status Summary
            * **Unit Tests**: ${{ needs.unit_test.result == 'success' && '✅ Passed' || '❌ Failed' }}

            [View Detailed Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})