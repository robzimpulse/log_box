name: Unit Test Log Box

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Define the matrix setup
  # Add or remove packages here as they are created in your /packages directory
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - id: set-matrix
        run: |
          # You can manually list them or use a script to auto-detect directories
          echo 'packages=["log_box", "log_box_dio_logger", "log_box_navigation_observer", "log_box_in_app_webview_logger", "log_box_persistent_storage_drift"]' >> $GITHUB_OUTPUT

  baseline:
    needs: [setup-matrix]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        package: ${{ fromJson(needs.setup-matrix.outputs.packages) }}
    outputs:
      # This creates a map of package-name to coverage value
      total_coverage: ${{ steps.coverage_extraction.outputs.total_coverage }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: master

      - name: "Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: "Install Packages"
        working-directory: ./packages/${{ matrix.package }}
        run: flutter pub get

      - name: 'Run Test'
        working-directory: ./packages/${{ matrix.package }}
        run: flutter test --coverage

      - id: coverage_extraction
        name: "Extract Coverage Percentage"
        working-directory: ./packages/${{ matrix.package }}
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          TOTAL_COVERAGE=$(lcov --summary coverage/lcov.info | grep lines | cut -d ' ' -f 4 | cut -d '%' -f 1)
          echo "total_coverage=$TOTAL_COVERAGE" >> $GITHUB_OUTPUT

  unit_test:
    needs: [setup-matrix]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.setup-matrix.outputs.packages) }}
    outputs:
      total_coverage: ${{ steps.coverage_extraction.outputs.total_coverage }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: "Install Packages"
        working-directory: ./packages/${{ matrix.package }}
        run: flutter pub get

      - name: 'Run Test'
        working-directory: ./packages/${{ matrix.package }}
        run: flutter test --coverage

      - id: coverage_extraction
        name: "Extract Coverage Percentage"
        working-directory: ./packages/${{ matrix.package }}
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          TOTAL_COVERAGE=$(lcov --summary coverage/lcov.info | grep lines | cut -d ' ' -f 4 | cut -d '%' -f 1)
          echo "total_coverage=$TOTAL_COVERAGE" >> $GITHUB_OUTPUT

  compare_coverage:
    needs: [setup-matrix, baseline, unit_test]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        package: ${{ fromJson(needs.setup-matrix.outputs.packages) }}
    steps:
      - name: 'Compare Results'
        id: compare
        run: |
          # Use the 'needs' context to find the specific matrix instance output
          # Syntax: needs.<job_id>.outputs.<output_name> (Note: outputs from matrix jobs are indexed by matrix properties)
          BASE=${{ needs.baseline.outputs.total_coverage }}
          PR=${{ needs.unit_test.outputs.total_coverage }}

          # If either is empty, default to 0
          BASE=${BASE:-0.00}
          PR=${PR:-0.00}

          DIFF=$(awk "BEGIN {print $PR - $BASE}")
          if (( $(echo "$DIFF < 0" | bc -l) )); then ICON="📉"; elif (( $(echo "$DIFF > 0" | bc -l) )); then ICON="📈"; DIFF="+$DIFF"; else ICON="➖"; fi
          
          echo "base_val=$BASE" >> $GITHUB_OUTPUT
          echo "pr_val=$PR" >> $GITHUB_OUTPUT
          echo "diff=$DIFF" >> $GITHUB_OUTPUT
          echo "icon=$ICON" >> $GITHUB_OUTPUT

      - name: 'Find Previous Results'
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'CI/CD Pipeline Results (${{ matrix.package }})'

      - name: 'Create or Update Comment'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            # CI/CD Pipeline Results (${{ matrix.package }})

            | Metric | Main (Base) | PR (Current) | Diff |
            |:---:|:---:|:---:|:---|
            | **Total Coverage** | ${{ steps.compare.outputs.base_val }}% | ${{ steps.compare.outputs.pr_val }}% | ${{ steps.compare.outputs.icon }} **${{ steps.compare.outputs.diff }}%** |

            ### Status Summary
            * **Unit Tests**: ✅ Passed

            [View Detailed Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})