name: Unit Test Log Box

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/log_box/**'
    branches:
      - 'master'
  pull_request:
    paths:
      - 'packages/log_box/**'
    types: [opened, reopened, synchronize]

jobs:
  baseline:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      total_coverage: ${{ steps.coverage_extraction.outputs.total_coverage }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: master

      - name: "Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: "Install Packages"
        working-directory: ./packages/log_box
        run: flutter pub get

      - name: 'Run Test'
        working-directory: ./packages/log_box
        run: flutter test --coverage

      - id: coverage_extraction
        name: "Extract Coverage Percentage"
        working-directory: ./packages/log_box
        run: |
          # Install lcov to use the lcov --summary command
          sudo apt-get update
          sudo apt-get install -y lcov

          # Extract the percentage
          # We use lcov summary and awk to isolate the 'lines' percentage
          TOTAL_COVERAGE=$(lcov --summary coverage/lcov.info | grep lines | cut -d ' ' -f 4 | cut -d '%' -f 1)

          # Set the output for this step
          echo "total_coverage=$TOTAL_COVERAGE" >> $GITHUB_OUTPUT

          # Post to the Step Summary so it's visible in the GitHub UI
          echo "### 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "* **Package:** log_box" >> $GITHUB_STEP_SUMMARY
          echo "* **Line Coverage:** ${TOTAL_COVERAGE}%" >> $GITHUB_STEP_SUMMARY

  unit_test:
    runs-on: ubuntu-latest
    outputs:
      total_coverage: ${{ steps.coverage_extraction.outputs.total_coverage }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: "Install Packages"
        working-directory: ./packages/log_box
        run: flutter pub get

      - name: 'Run Test'
        working-directory: ./packages/log_box
        run: flutter test --coverage

      - id: coverage_extraction
        name: "Extract Coverage Percentage"
        working-directory: ./packages/log_box
        run: |
          # Install lcov to use the lcov --summary command
          sudo apt-get update
          sudo apt-get install -y lcov
          
          # Extract the percentage
          # We use lcov summary and awk to isolate the 'lines' percentage
          TOTAL_COVERAGE=$(lcov --summary coverage/lcov.info | grep lines | cut -d ' ' -f 4 | cut -d '%' -f 1)
          
          # Set the output for this step
          echo "total_coverage=$TOTAL_COVERAGE" >> $GITHUB_OUTPUT

          # Post to the Step Summary so it's visible in the GitHub UI
          echo "### 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "* **Package:** log_box" >> $GITHUB_STEP_SUMMARY
          echo "* **Line Coverage:** ${TOTAL_COVERAGE}%" >> $GITHUB_STEP_SUMMARY

  compare_coverage:
    runs-on: ubuntu-latest
    needs: [baseline, unit_test]
    if: github.event_name == 'pull_request'
    steps:
      - name: "Report Coverage Comparison"
        run: |
          BASELINE_COVERAGE=${{ needs.baseline.outputs.total_coverage }}
          UNIT_TEST_COVERAGE=${{ needs.unit_test.outputs.total_coverage }}
          
          # Calculate the difference
          # Using 'bc -l' for floating-point arithmetic
          COVERAGE_DIFF=$(echo "$UNIT_TEST_COVERAGE - $BASELINE_COVERAGE" | bc -l)
          
          # Format the difference to one decimal place for readability
          # We use printf for formatting, and capture its output
          DIFF_PERCENTAGE=$(printf "%.1f" "$COVERAGE_DIFF")
          
          echo "### ⚖️ Coverage Comparison Report" >> $GITHUB_STEP_SUMMARY
          echo "* **Baseline Coverage:** ${BASELINE_COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          echo "* **Unit Test Coverage:** ${UNIT_TEST_COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          
          # Report the difference
          if (( $(echo "$DIFF_PERCENTAGE > 0" | bc -l) )); then
            echo "* **Difference:** +${DIFF_PERCENTAGE}% (Coverage increased)" >> $GITHUB_STEP_SUMMARY
          elif (( $(echo "$DIFF_PERCENTAGE < 0" | bc -l) )); then
            echo "* **Difference:** ${DIFF_PERCENTAGE}% (Coverage decreased)" >> $GITHUB_STEP_SUMMARY
          else
            echo "* **Difference:** ${DIFF_PERCENTAGE}% (Coverage unchanged)" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Optional: Add logic to fail the build if coverage drops significantly
          if (( $(echo "$UNIT_TEST_COVERAGE < $BASELINE_COVERAGE" | bc -l) )); then
            echo "❌ Coverage has decreased from ${BASELINE_COVERAGE}% to ${UNIT_TEST_COVERAGE}%." >> $GITHUB_STEP_SUMMARY
            echo "Coverage decreased. Failing job."
            exit 1
          else
            echo "✅ Coverage is maintained or improved (${BASELINE_COVERAGE}% -> ${UNIT_TEST_COVERAGE}%)." >> $GITHUB_STEP_SUMMARY
          fi
