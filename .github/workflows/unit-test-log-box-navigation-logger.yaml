name: Unit Test Log Box Navigation Logger

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/log_box_navigation_logger/**'
  pull_request:
    paths:
      - 'packages/log_box_navigation_logger/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: "Install Packages"
        working-directory: ./packages/log_box_navigation_logger
        run: flutter pub get

      - name: 'Run Test'
        working-directory: ./packages/log_box_navigation_logger
        run: flutter test