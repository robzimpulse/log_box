# unit-test.yaml — CI for the log_box package.
#
# Purpose: on every push to master and every PR, run unit tests with
# coverage and lint (analyze + format check). On PRs, also measure master's
# coverage as a baseline and post/update a single PR comment with the
# coverage diff and job status.
#
# Usage: runs automatically; trigger manually via "Run workflow"
# (workflow_dispatch). Locally the same checks are `make coverage`,
# `make analyze` and `make format-check`.

name: Unit Test log_box

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      total_coverage: ${{ steps.coverage_extraction.outputs.total_coverage }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: master

      - name: "Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: "Install Packages"
        run: make get

      - name: 'Run Test'
        run: make coverage

      - id: coverage_extraction
        name: "Extract Coverage Percentage"
        run: |
          # Install lcov to use the lcov --summary command
          sudo apt-get update
          sudo apt-get install -y lcov

          # Extract the percentage
          # We use lcov summary and awk to isolate the 'lines' percentage
          TOTAL_COVERAGE=$(lcov --summary coverage/lcov.info | grep lines | cut -d ' ' -f 4 | cut -d '%' -f 1)

          # Set the output for this step
          echo "total_coverage=$TOTAL_COVERAGE" >> "$GITHUB_OUTPUT"

          # Post to the Step Summary so it's visible in the GitHub UI
          {
            echo "### 📊 Coverage Report"
            echo "* **Package:** log_box"
            echo "* **Line Coverage:** ${TOTAL_COVERAGE}%"
          } >> "$GITHUB_STEP_SUMMARY"

  unit_test:
    runs-on: ubuntu-latest
    outputs:
      total_coverage: ${{ steps.coverage_extraction.outputs.total_coverage }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: "Install Packages"
        run: make get

      - name: 'Run Test'
        run: make coverage

      - id: coverage_extraction
        name: "Extract Coverage Percentage"
        run: |
          # Install lcov to use the lcov --summary command
          sudo apt-get update
          sudo apt-get install -y lcov

          # Extract the percentage
          # We use lcov summary and awk to isolate the 'lines' percentage
          TOTAL_COVERAGE=$(lcov --summary coverage/lcov.info | grep lines | cut -d ' ' -f 4 | cut -d '%' -f 1)

          # Set the output for this step
          echo "total_coverage=$TOTAL_COVERAGE" >> "$GITHUB_OUTPUT"

          # Post to the Step Summary so it's visible in the GitHub UI
          {
            echo "### 📊 Coverage Report"
            echo "* **Package:** log_box"
            echo "* **Line Coverage:** ${TOTAL_COVERAGE}%"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      # Must run before analyze: it also resolves example/, which analyze covers.
      - name: "Install Packages"
        run: make get

      - name: "Analyze"
        run: make analyze

      - name: "Check Formatting"
        run: make format-check

  compare_coverage:
    runs-on: ubuntu-latest
    needs: [baseline, unit_test, lint]
    if: always() && github.event_name == 'pull_request' && needs.baseline.result != 'skipped'
    steps:

      - name: 'Compare Results'
        id: compare
        run: |
          # Fallback to 0.00 if outputs are missing or null
          BASE=${{ needs.baseline.outputs.total_coverage || '0.00' }}
          PR=${{ needs.unit_test.outputs.total_coverage || '0.00' }}

          # Floating point math via awk
          DIFF=$(awk "BEGIN {print $PR - $BASE}")

          if (( $(echo "$DIFF < 0" | bc -l) )); then
            ICON="📉"
          elif (( $(echo "$DIFF > 0" | bc -l) )); then
            ICON="📈"
            DIFF="+$DIFF"
          else
            ICON="➖"
          fi

          {
            echo "base_val=$BASE"
            echo "pr_val=$PR"
            echo "diff=$DIFF"
            echo "icon=$ICON"
          } >> "$GITHUB_OUTPUT"

      - name: 'Find Previous Results'
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'CI/CD Pipeline Results (log_box)'

      - name: 'Create or Update Comment'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            # CI/CD Pipeline Results (log_box)

            | Metric | Main (Base) | PR (Current) | Diff |
            |:---:|:---:|:---:|:---|
            | **Total Coverage** | ${{ steps.compare.outputs.base_val }}% | ${{ steps.compare.outputs.pr_val }}% | ${{ steps.compare.outputs.icon }} **${{ steps.compare.outputs.diff }}%** |

            ### Status Summary
            * **Unit Tests**: ${{ needs.unit_test.result == 'success' && '✅ Passed' || '❌ Failed' }}
            * **Lint**: ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }}

            [View Detailed Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
